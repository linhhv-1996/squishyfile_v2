<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link rel="icon" href="/favicon.png" type="image/png" />
		<link rel="shortcut icon" href="/favicon.png" type="image/png" />
		<link rel="apple-touch-icon" href="/favicon.png" />
		%sveltekit.head%
	</head>
	<!--
		This site behaves as an MPA: every internal link does a full page
		reload (no client-side routing, no hover/preload). data-sveltekit-reload
		set here on <body> applies to every link inside it.
	-->
	<body data-sveltekit-reload>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
